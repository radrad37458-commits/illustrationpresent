<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>プレゼントが届きました</title>

  <style>
    /* =========================
       基本設定
    ========================= */

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      background: linear-gradient(
        135deg,
        #fff5f7,
        #f8f4ff
      );

      color: #333;

      /* 横スクロールは禁止 */
      overflow-x: hidden;

      /*
        縦方向は必要になったら
        自然にスクロールできる
      */
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;
    }


    /* =========================
       アプリ全体
    ========================= */

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;

      /*
        基本は完全中央
      */
      align-items: center;
      justify-content: center;

      /*
        画面端との余白
      */
      padding:
        max(24px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      /*
        コンテンツが画面より高くなった場合も
        上下が切れないようにする
      */
      min-height: 100dvh;
    }


    /* =========================
       各画面
    ========================= */

    .screen {
      width: 100%;
      max-width: 520px;

      margin: auto;

      text-align: center;

      animation: fadeIn 0.5s ease;
    }


    /* =========================
       カード
    ========================= */

    .card {
      width: 100%;

      padding: clamp(28px, 6vw, 50px)
               clamp(20px, 6vw, 40px);

      background: rgba(255, 255, 255, 0.92);

      border-radius: 28px;

      box-shadow:
        0 15px 50px rgba(0, 0, 0, 0.12);

      backdrop-filter: blur(10px);
    }


    /* =========================
       タイトル
    ========================= */

    h1 {
      margin: 0 0 12px;

      font-size: clamp(24px, 6vw, 34px);

      line-height: 1.4;

      color: #444;
    }

    .message {
      margin: 0 0 28px;

      font-size: clamp(14px, 4vw, 18px);

      line-height: 1.7;

      color: #666;
    }


    /* =========================
       プレゼント箱
    ========================= */

    .gift-area {
      display: flex;
      justify-content: center;
      align-items: center;

      margin: 10px auto 30px;

      /*
        画面幅に合わせてサイズ調整
      */
      width: min(240px, 60vw);
      height: min(240px, 60vw);
    }

    .gift {
      position: relative;

      width: min(180px, 48vw);
      height: min(150px, 40vw);

      cursor: pointer;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .gift:hover {
      transform: scale(1.06);
      filter: brightness(1.03);
    }

    .gift:active {
      transform: scale(0.96);
    }


    /* 箱 */

    .gift-box {
      position: absolute;

      left: 10%;
      bottom: 0;

      width: 80%;
      height: 65%;

      background: linear-gradient(
        135deg,
        #ff8fa3,
        #ff5f7e
      );

      border-radius: 8px;

      box-shadow:
        0 8px 15px rgba(0, 0, 0, 0.15);
    }


    /* 箱の縦リボン */

    .gift-box::before {
      content: "";

      position: absolute;

      left: 42%;

      top: 0;

      width: 16%;
      height: 100%;

      background: #ffd166;
    }


    /* 箱の横リボン */

    .gift-box::after {
      content: "";

      position: absolute;

      left: 0;
      top: 35%;

      width: 100%;
      height: 16%;

      background: #ffd166;
    }


    /* フタ */

    .gift-lid {
      position: absolute;

      left: 5%;
      top: 20%;

      width: 90%;
      height: 25%;

      background: linear-gradient(
        135deg,
        #ff9daf,
        #ff6f89
      );

      border-radius: 8px;

      z-index: 2;

      box-shadow:
        0 5px 10px rgba(0, 0, 0, 0.12);

      transition:
        transform 0.7s cubic-bezier(.68,-0.55,.27,1.55);
    }


    /* フタのリボン */

    .gift-lid::after {
      content: "";

      position: absolute;

      left: 42%;

      top: 0;

      width: 16%;
      height: 100%;

      background: #ffd166;
    }


    /* リボン */

    .ribbon-left,
    .ribbon-right {
      position: absolute;

      top: 0;

      width: 50px;
      height: 35px;

      border: 8px solid #ffd166;

      border-radius: 50%;
    }

    .ribbon-left {
      left: 30%;

      transform:
        rotate(-25deg)
        translateY(-15px);
    }

    .ribbon-right {
      right: 30%;

      transform:
        rotate(25deg)
        translateY(-15px);
    }


    /* =========================
       開封アニメーション
    ========================= */

    .gift.opening .gift-lid {
      transform:
        translateY(-70px)
        rotate(-8deg);
    }

    .gift.opening {
      animation: giftShake 0.5s ease;
    }

    @keyframes giftShake {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-4deg);
      }

      50% {
        transform: rotate(4deg);
      }

      75% {
        transform: rotate(-3deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }


    /* =========================
       ボタン
    ========================= */

    .open-button {
      width: 100%;
      max-width: 300px;

      min-height: 52px;

      padding: 14px 24px;

      border: none;
      border-radius: 999px;

      background: linear-gradient(
        135deg,
        #ff7b93,
        #ff5b7c
      );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(255, 91, 124, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .open-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px rgba(255, 91, 124, 0.35);
    }

    .open-button:active {
      transform: translateY(1px);
    }


    /* =========================
       ローディング画面
    ========================= */

    .loading {
      padding: 20px 0;
    }

    .loading-icon {
      font-size: 50px;

      margin-bottom: 20px;

      animation: bounce 1s infinite;
    }

    .loading-text {
      font-size: 18px;

      color: #666;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }


    /* =========================
       結果画面
    ========================= */

    .result-title {
      margin-bottom: 10px;

      color: #ff5f7e;
    }

    .result-message {
      margin-bottom: 24px;
    }


    /* =========================
       イラスト
    ========================= */

    .illustration-wrap {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      margin: 0 auto 28px;

      /*
        横幅に合わせる
      */
      overflow: hidden;

      border-radius: 18px;
    }

    #illustration {
      display: block;

      width: auto;
      max-width: 100%;

      /*
        通常はカード内に収める
      */
      max-height: 65vh;

      object-fit: contain;

      border-radius: 18px;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12);
    }


    /* =========================
       ダウンロードボタン
    ========================= */

    #download {
      display: block;

      width: 100%;
      max-width: 300px;

      margin: 0 auto;

      text-decoration: none;
    }

    #download button {
      width: 100%;

      min-height: 52px;

      padding: 14px 24px;

      border: none;
      border-radius: 999px;

      background: linear-gradient(
        135deg,
        #8b7cf6,
        #6d5ce7
      );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px rgba(109, 92, 231, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    #download button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px rgba(109, 92, 231, 0.35);
    }


    /* =========================
       キラキラ
    ========================= */

    .sparkle {
      position: fixed;

      pointer-events: none;

      font-size: 22px;

      animation:
        sparkle 1s ease-out forwards;

      z-index: 999;
    }

    @keyframes sparkle {
      0% {
        opacity: 1;
        transform:
          translate(0, 0)
          scale(0.5)
          rotate(0deg);
      }

      100% {
        opacity: 0;

        transform:
          translate(
            var(--x),
            var(--y)
          )
          scale(1.4)
          rotate(180deg);
      }
    }


    /* =========================
       フェードイン
    ========================= */

    @keyframes fadeIn {
      from {
        opacity: 0;

        transform:
          translateY(10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =========================
       小さいスマホ
    ========================= */

    @media (max-width: 360px) {

      #app {
        padding-left: 14px;
        padding-right: 14px;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .card {
        padding: 24px 16px;

        border-radius: 22px;
      }

      h1 {
        font-size: 23px;
      }

      .message {
        font-size: 14px;

        margin-bottom: 20px;
      }

      .gift-area {
        margin-bottom: 20px;
      }

      .open-button,
      #download button {
        font-size: 15px;
      }
    }


    /* =========================
       画面が縦にかなり小さい場合
       ※中央表示は維持
       ※必要ならスクロール
    ========================= */

    @media (max-height: 600px) {

      #app {
        /*
          中央配置を維持しつつ
          上下に余白を少なくする
        */
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .card {
        padding-top: 22px;
        padding-bottom: 22px;
      }

      .gift-area {
        margin-top: 0;
        margin-bottom: 18px;
      }

      .message {
        margin-bottom: 18px;
      }

      #illustration {
        max-height: 50vh;
      }
    }


    /* =========================
       アニメーションを減らす設定
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

        scroll-behavior: auto !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>


<body>

  <main id="app">

    <!-- =====================
         最初の画面
    ====================== -->

    <section
      id="welcome"
      class="screen"
    >

      <div class="card">

        <h1>
          🎁 プレゼントが届いています
        </h1>

        <p class="message">
          あなたのためのプレゼントです。<br>
          下の箱を開けてみてください！
        </p>


        <div class="gift-area">

          <div
            id="gift"
            class="gift"
            role="button"
            tabindex="0"
            aria-label="プレゼントを開ける"
          >

            <div class="ribbon-left"></div>
            <div class="ribbon-right"></div>

            <div class="gift-lid"></div>

            <div class="gift-box"></div>

          </div>

        </div>


        <button
          id="openButton"
          class="open-button"
          type="button"
        >
          🎁 プレゼントを開ける
        </button>

      </div>

    </section>


    <!-- =====================
         ローディング画面
    ====================== -->

    <section
      id="loading"
      class="screen"
      style="display: none;"
    >

      <div class="card">

        <div class="loading">

          <div class="loading-icon">
            🎁
          </div>

          <div class="loading-text">
            プレゼントを開封中…
          </div>

        </div>

      </div>

    </section>


    <!-- =====================
         結果画面
    ====================== -->

    <section
      id="result"
      class="screen"
      style="display: none;"
    >

      <div class="card">

        <h1 class="result-title">
          🎉 プレゼントが届きました！
        </h1>

        <p class="message result-message">
          受け取ってくれてありがとう！
        </p>


        <div class="illustration-wrap">

          <img
            id="illustration"
            src="present.png"
            alt="プレゼントのイラスト"
          >

        </div>


        <a
          id="download"
          href="present.png"
          download="present.png"
        >
          <button type="button">
            🖼️ イラストを受け取る ↓
          </button>
        </a>

      </div>

    </section>

  </main>


  <script>

    /* =========================
       要素取得
    ========================= */

    const gift =
      document.getElementById("gift");

    const openButton =
      document.getElementById("openButton");

    const welcome =
      document.getElementById("welcome");

    const loading =
      document.getElementById("loading");

    const result =
      document.getElementById("result");


    let opened = false;


    /* =========================
       プレゼントを開く
    ========================= */

    function openGift() {

      if (opened) {
        return;
      }

      opened = true;


      /* 箱を開ける */
      gift.classList.add("opening");


      /* キラキラ */
      createSparkles();


      /*
        少し待って
        ローディング画面へ
      */

      setTimeout(() => {

        welcome.style.display = "none";

        loading.style.display = "block";

        /*
          スクロール位置を一番上へ
        */
        window.scrollTo({
          top: 0,
          behavior: "instant"
        });

      }, 700);


      /*
        開封完了
      */

      setTimeout(() => {

        loading.style.display = "none";

        result.style.display = "block";


        /*
          結果画面が表示されたら
          一番上へ
        */

        window.scrollTo({
          top: 0,
          behavior: "instant"
        });


        createSparkles();

      }, 3000);

    }


    /* =========================
       ボタンクリック
    ========================= */

    openButton.addEventListener(
      "click",
      openGift
    );


    /* =========================
       箱クリック
    ========================= */

    gift.addEventListener(
      "click",
      openGift
    );


    /* =========================
       キーボード操作
    ========================= */

    gift.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          openGift();

        }

      }
    );


    /* =========================
       キラキラ生成
    ========================= */

    function createSparkles() {

      const symbols = [
        "✨",
        "⭐",
        "💫",
        "🌟"
      ];


      for (let i = 0; i < 18; i++) {

        const sparkle =
          document.createElement("div");

        sparkle.className = "sparkle";

        sparkle.textContent =
          symbols[
            Math.floor(
              Math.random() * symbols.length
            )
          ];


        /*
          画面中央付近から
          ランダムに飛ばす
        */

        const x =
          (Math.random() - 0.5) * 500;

        const y =
          (Math.random() - 0.5) * 500;


        sparkle.style.left =
          "50%";

        sparkle.style.top =
          "40%";


        sparkle.style.setProperty(
          "--x",
          `${x}px`
        );

        sparkle.style.setProperty(
          "--y",
          `${y}px`
        );


        document.body.appendChild(
          sparkle
        );


        /*
          アニメーション終了後に削除
        */

        setTimeout(() => {

          sparkle.remove();

        }, 1100);

      }

    }

  </script>

</body>
</html>
